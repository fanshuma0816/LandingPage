<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 360" role="img" aria-labelledby="title desc">
  <title id="title">Albert Heijn grocery receipt</title>
  <desc id="desc">A refined Dutch grocery receipt learning material inspired by Albert Heijn shopping vocabulary.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="301" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="342" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M65 25 L213 41 L198 314 L47 296 Z" fill="#fff8eb" filter="url(#cut)"/>
    <path d="M65 25 L213 41 L209 82 L61 67 Z" fill="#1f74d1" filter="url(#cut)"/>
    <text x="78" y="57" fill="#fff8eb" font-family="Georgia, serif" font-size="28" font-weight="700" letter-spacing="0">AH</text>
    <text x="122" y="56" fill="#fff8eb" font-family="Georgia, serif" font-size="14" font-weight="700" letter-spacing="0">boodschappen</text>
    <rect x="72" y="92" width="101" height="7" fill="#47433c" opacity="0.26" transform="rotate(6 72 92)"/>
    <rect x="72" y="114" width="82" height="7" fill="#47433c" opacity="0.2" transform="rotate(6 72 114)"/>
    <rect x="72" y="136" width="111" height="7" fill="#47433c" opacity="0.18" transform="rotate(6 72 136)"/>
    <path d="M70 163 L176 175 L171 230 L65 218 Z" fill="#b9d9f7" filter="url(#cut)"/>
    <text x="87" y="197" fill="#1f74d1" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="0" transform="rotate(6 87 197)">bonus</text>
    <rect x="70" y="249" width="75" height="7" fill="#47433c" opacity="0.23" transform="rotate(6 70 249)"/>
    <rect x="70" y="270" width="105" height="7" fill="#47433c" opacity="0.18" transform="rotate(6 70 270)"/>
    <circle cx="191" cy="104" r="13" fill="#f39a45"/>
    <text x="183" y="108" fill="#fff8eb" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="0">NL</text>
  </g>
</svg>
