<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 230" role="img" aria-labelledby="title desc">
  <title id="title">Jumbo shopping note</title>
  <desc id="desc">A refined yellow supermarket note for learning everyday Dutch shopping language.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="302" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="343" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M43 48 L260 31 L280 154 L62 181 Z" fill="#ffd746" filter="url(#cut)"/>
    <path d="M64 70 L238 57 L244 94 L70 109 Z" fill="#fff8eb" filter="url(#cut)"/>
    <text x="84" y="94" fill="#e85c4f" font-family="Georgia, serif" font-size="33" font-weight="700" letter-spacing="0" transform="rotate(-4 84 94)">Jumbo</text>
    <text x="76" y="133" fill="#47433c" font-family="Georgia, serif" font-size="18" font-weight="700" letter-spacing="0" transform="rotate(-5 76 133)">kassa woorden</text>
    <rect x="77" y="150" width="92" height="7" fill="#47433c" opacity="0.28" transform="rotate(-5 77 150)"/>
    <rect x="181" y="143" width="46" height="7" fill="#e85c4f" opacity="0.75" transform="rotate(-5 181 143)"/>
    <path d="M231 43 L270 40 L276 78 L237 82 Z" fill="#f6beb5" filter="url(#cut)"/>
    <text x="240" y="67" fill="#e85c4f" font-family="Georgia, serif" font-size="16" font-weight="700" letter-spacing="0" transform="rotate(-5 240 67)">2+1</text>
  </g>
</svg>
