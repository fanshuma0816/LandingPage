<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Blackboard grammar lesson</title>
  <desc id="desc">A refined classroom blackboard for Dutch grammar explanations.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="305" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="346" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M56 49 L298 35 L313 174 L70 193 Z" fill="#3e9b68" filter="url(#cut)"/>
    <path d="M73 66 L279 55 L290 154 L84 169 Z" fill="#28313d" filter="url(#cut)"/>
    <text x="103" y="95" fill="#fff8eb" font-family="Georgia, serif" font-size="33" font-weight="700" letter-spacing="0" transform="rotate(-3 103 95)">de / het</text>
    <rect x="108" y="118" width="86" height="6" fill="#ffd746" opacity="0.86" transform="rotate(-3 108 118)"/>
    <text x="212" y="127" fill="#b9d9f7" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="0" transform="rotate(-3 212 127)">V2</text>
    <rect x="83" y="183" width="220" height="14" fill="#f39a45" transform="rotate(-4 83 183)"/>
    <rect x="113" y="207" width="72" height="11" fill="#f0e6d2" transform="rotate(-4 113 207)"/>
    <circle cx="287" cy="67" r="10" fill="#e85c4f"/>
    <text x="111" y="149" fill="#f0e6d2" font-family="Georgia, serif" font-size="15" font-weight="400" letter-spacing="0" transform="rotate(-3 111 149)">grammar in context</text>
  </g>
</svg>
