<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="title desc">
  <title id="title">Open Dutch course book</title>
  <desc id="desc">An open course book illustration for structured Dutch lessons.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="308" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="349" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M55 47 L188 31 L207 218 L70 239 Z" fill="#fff0a7" filter="url(#cut)"/>
    <path d="M198 32 L333 51 L309 239 L207 218 Z" fill="#fff8eb" filter="url(#cut)"/>
    <path d="M188 31 L207 218 L198 219 L181 33 Z" fill="#e85c4f" filter="url(#cut)"/>
    <text x="82" y="83" fill="#f39a45" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="0" transform="rotate(-6 82 83)">Nederlands</text>
    <rect x="84" y="115" width="74" height="7" fill="#47433c" opacity="0.25" transform="rotate(-6 84 115)"/>
    <rect x="87" y="141" width="94" height="7" fill="#47433c" opacity="0.2" transform="rotate(-6 87 141)"/>
    <path d="M226 73 L298 83 L293 135 L220 125 Z" fill="#b9d9f7" filter="url(#cut)"/>
    <text x="235" y="109" fill="#1f74d1" font-family="Georgia, serif" font-size="30" font-weight="700" letter-spacing="0" transform="rotate(7 235 109)">A2</text>
    <rect x="223" y="161" width="70" height="7" fill="#47433c" opacity="0.23" transform="rotate(7 223 161)"/>
    <rect x="220" y="188" width="51" height="7" fill="#e85c4f" opacity="0.62" transform="rotate(7 220 188)"/>
  </g>
</svg>
