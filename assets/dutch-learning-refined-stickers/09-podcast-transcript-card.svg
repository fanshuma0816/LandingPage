<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 220" role="img" aria-labelledby="title desc">
  <title id="title">Podcast transcript card</title>
  <desc id="desc">A refined audio and transcript card for guided podcast lessons.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="309" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="350" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M46 44 L362 30 L380 155 L64 181 Z" fill="#d9d0f3" filter="url(#cut)"/>
    <path d="M72 64 L173 59 L181 125 L79 134 Z" fill="#8977d9" filter="url(#cut)"/>
    <circle cx="126" cy="96" r="26" fill="#fff8eb"/>
    <path d="M118 79 L148 96 L121 116 Z" fill="#8977d9"/>
    <rect x="207" y="67" width="18" height="58" fill="#1f74d1" transform="rotate(-3 207 67)"/>
    <rect x="235" y="78" width="18" height="37" fill="#4aa7a1" transform="rotate(-3 235 78)"/>
    <rect x="263" y="56" width="18" height="71" fill="#1f74d1" transform="rotate(-3 263 56)"/>
    <rect x="291" y="85" width="18" height="25" fill="#4aa7a1" transform="rotate(-3 291 85)"/>
    <rect x="94" y="152" width="164" height="7" fill="#47433c" opacity="0.26" transform="rotate(-4 94 152)"/>
    <rect x="277" y="144" width="55" height="7" fill="#e85c4f" opacity="0.62" transform="rotate(-4 277 144)"/>
    <text x="207" y="156" fill="#47433c" font-family="Georgia, serif" font-size="18" font-weight="700" letter-spacing="0" transform="rotate(-4 207 156)">transcript</text>
  </g>
</svg>
