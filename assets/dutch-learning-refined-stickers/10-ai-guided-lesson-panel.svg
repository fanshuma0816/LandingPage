<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img" aria-labelledby="title desc">
  <title id="title">AI guided lesson panel</title>
  <desc id="desc">A refined AI-guided lesson interface with lesson steps and feedback.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="310" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="351" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M51 39 L315 25 L334 246 L69 265 Z" fill="#fff8eb" filter="url(#cut)"/>
    <path d="M72 59 L306 47 L311 92 L76 106 Z" fill="#4aa7a1" filter="url(#cut)"/>
    <text x="98" y="88" fill="#fff8eb" font-family="Georgia, serif" font-size="23" font-weight="700" letter-spacing="0" transform="rotate(-3 98 88)">guided lesson</text>
    <path d="M87 129 L190 122 L196 166 L107 174 L96 188 L98 175 L90 176 Z" fill="#c4e8e3" filter="url(#cut)"/>
    <path d="M150 181 L284 171 L291 218 L172 230 L164 245 L163 231 L153 232 Z" fill="#fff0a7" filter="url(#cut)"/>
    <rect x="110" y="145" width="55" height="7" fill="#47433c" opacity="0.26" transform="rotate(-4 110 145)"/>
    <rect x="175" y="198" width="68" height="7" fill="#47433c" opacity="0.24" transform="rotate(-4 175 198)"/>
    <circle cx="282" cy="70" r="11" fill="#e85c4f"/>
    <text x="253" y="202" fill="#f39a45" font-family="Georgia, serif" font-size="25" font-weight="700" letter-spacing="0" transform="rotate(-4 253 202)">AI</text>
  </g>
</svg>
