<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 260" role="img" aria-labelledby="title desc">
  <title id="title">Study desk tools</title>
  <desc id="desc">A refined set of desk tools with laptop, pencil, notebook, and eraser in one balanced object.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="311" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.64 0 0 0 0 0.58 0 0 0 0 0.48 0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="multiply"/>
    </filter>
    <filter id="cut" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="352" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="0.55"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <path d="M60 58 L225 48 L235 143 L70 156 Z" fill="#1f74d1" filter="url(#cut)"/>
    <path d="M82 74 L205 67 L211 128 L88 137 Z" fill="#fff8eb" filter="url(#cut)"/>
    <path d="M42 160 L256 145 L267 174 L53 191 Z" fill="#b9d9f7" filter="url(#cut)"/>
    <path d="M276 61 L351 70 L340 186 L265 177 Z" fill="#fff0a7" filter="url(#cut)"/>
    <rect x="286" y="96" width="43" height="6" fill="#47433c" opacity="0.24" transform="rotate(7 286 96)"/>
    <rect x="283" y="121" width="51" height="6" fill="#f39a45" opacity="0.56" transform="rotate(7 283 121)"/>
    <path d="M142 216 L306 174 L324 193 L159 235 Z" fill="#ffd746" filter="url(#cut)"/>
    <path d="M306 174 L348 163 L324 193 Z" fill="#fff8eb" filter="url(#cut)"/>
    <path d="M69 205 L127 198 L139 231 L80 239 Z" fill="#f6beb5" filter="url(#cut)"/>
    <text x="79" y="224" fill="#e85c4f" font-family="Georgia, serif" font-size="17" font-weight="700" letter-spacing="0" transform="rotate(-7 79 224)">fix</text>
  </g>
</svg>
