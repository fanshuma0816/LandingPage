<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dutch Learning Refined Stickers</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #4f4a43;
      background:
        radial-gradient(circle, #ddd8cf 1px, transparent 1.4px) 0 0 / 42px 42px,
        #fffefa;
    }
    main {
      width: min(1160px, calc(100vw - 40px));
      margin: 42px auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 650;
      margin: 0 0 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 36px 44px;
      align-items: center;
    }
    figure {
      margin: 0;
      display: grid;
      gap: 10px;
      justify-items: center;
    }
    img {
      max-width: 100%;
      height: 142px;
      object-fit: contain;
    }
    figcaption {
      font-size: 12px;
      color: #756e64;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Dutch Learning Refined Stickers</h1>
    <section class="grid">
      <figure><img src="01-ah-grocery-receipt.svg" alt="Albert Heijn grocery receipt"><figcaption>Albert Heijn grocery receipt</figcaption></figure>
      <figure><img src="02-jumbo-shopping-note.svg" alt="Jumbo shopping note"><figcaption>Jumbo shopping note</figcaption></figure>
      <figure><img src="03-dutch-newspaper-spread.svg" alt="Dutch newspaper spread"><figcaption>Dutch newspaper spread</figcaption></figure>
      <figure><img src="04-government-letter.svg" alt="Dutch government letter"><figcaption>Dutch government letter</figcaption></figure>
      <figure><img src="05-blackboard-grammar.svg" alt="Blackboard grammar lesson"><figcaption>Blackboard grammar lesson</figcaption></figure>
      <figure><img src="06-train-ticket-material.svg" alt="Dutch train ticket material"><figcaption>Dutch train ticket material</figcaption></figure>
      <figure><img src="07-cafe-conversation-scene.svg" alt="Cafe conversation scene"><figcaption>Cafe conversation scene</figcaption></figure>
      <figure><img src="08-course-book-open.svg" alt="Open Dutch course book"><figcaption>Open Dutch course book</figcaption></figure>
      <figure><img src="09-podcast-transcript-card.svg" alt="Podcast transcript card"><figcaption>Podcast transcript card</figcaption></figure>
      <figure><img src="10-ai-guided-lesson-panel.svg" alt="AI guided lesson panel"><figcaption>AI guided lesson panel</figcaption></figure>
      <figure><img src="11-study-desk-tools.svg" alt="Study desk tools"><figcaption>Study desk tools</figcaption></figure>
      <figure><img src="12-dutch-life-materials-cluster.svg" alt="Dutch life materials cluster"><figcaption>Dutch life materials cluster</figcaption></figure>
    </section>
  </main>
</body>
</html>
